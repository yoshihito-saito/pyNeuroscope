[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyneuroscope"
version = "0.1.0"
description = "Python desktop tools for NeuroScope-like electrophysiology viewing and XML metadata editing."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "PySide6",
  "pyqtgraph",
  "scipy",
]

[project.scripts]
pyneuroscope = "pyneuroscope.app:main"

[project.optional-dependencies]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyneuroscope = ["resources/*.json", "resources/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
